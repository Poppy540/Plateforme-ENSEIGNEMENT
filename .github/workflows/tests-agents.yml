# Batterie de tests des agents (prompt maître §2, cadrage Partie D).
# - À chaque changement de prompt, skill, outil, configuration ou lanceur : tests de la mécanique (sans coût).
# - Passage réel avec le modèle (PAYANT ; estimation affichée avant lancement : ~9 USD pour le Professeur,
#   ~25 USD pour le Scénariste, ~15 USD pour l'Évaluateur, ~7 USD pour le Tuteur, par passage complet) : seulement si le propriétaire
#   l'active (variable de dépôt TESTS_AGENTS_REELS = oui, ou lancement manuel) ET a ajouté le secret
#   ANTHROPIC_API_KEY dans les secrets du dépôt GitHub.
name: Tests des agents

on:
  push:
    paths:
      - "agents/**"
      - "referentiels/*/agents/**"
      - "tests/**"
      - "docs/prompt-claude-code.md"
      - "application/src/lib/agents/**"
      - "application/src/lib/tests-agents/**"
      - "application/scripts/lancer-tests-agents.mts"
      - ".github/workflows/tests-agents.yml"
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent testé"
        type: choice
        options:
          [
            professeur,
            scenariste,
            evaluateur,
            tuteur,
            support,
            coordinateur,
            conformite,
            recruteur,
          ]
        default: professeur
      scenarios:
        description: "Scénarios à lancer (vide = tous), par exemple PR-01,TC-09"
        required: false
      executions:
        description: "Exécutions par scénario (vide = config.yaml)"
        required: false

permissions:
  contents: read

jobs:
  mecanique:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # revue du Jalon 24, S16 : pas de jeton laissé sur le disque
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: application/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test src/lib/agents src/lib/tests-agents

  passage-reel:
    needs: mecanique
    if: vars.TESTS_AGENTS_REELS == 'oui' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    env:
      MODE_MODELE: anthropic
    # Revue du Jalon 24, S15 : la clé n'est donnée qu'aux deux étapes qui en ont besoin (pas à l'installation).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # revue du Jalon 24, S16 : pas de jeton laissé sur le disque
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: application/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Vérifier la présence de la clé (sans l'afficher)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Secret ANTHROPIC_API_KEY absent, passage réel impossible."; exit 1; }
      - name: Passage réel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT: ${{ inputs.agent || 'professeur' }}
          SCENARIOS: ${{ inputs.scenarios }}
          EXECUTIONS: ${{ inputs.executions }}
        run: |
          # Saisies passées par variables d'environnement et contrôlées (pas d'injection dans le shell).
          [[ "$AGENT" =~ ^(professeur|scenariste|evaluateur|tuteur|support|coordinateur|conformite|recruteur)$ ]] || { echo "Agent invalide"; exit 1; }
          ARGS=(--confirmer --agent "$AGENT")
          if [ -n "$SCENARIOS" ]; then
            [[ "$SCENARIOS" =~ ^[A-Z]{2}-[0-9]{2}(,[A-Z]{2}-[0-9]{2})*$ ]] || { echo "Liste de scénarios invalide"; exit 1; }
            ARGS+=(--scenarios "$SCENARIOS")
          fi
          if [ -n "$EXECUTIONS" ]; then
            [[ "$EXECUTIONS" =~ ^[1-9][0-9]?$ ]] || { echo "Nombre d'exécutions invalide"; exit 1; }
            ARGS+=(--executions "$EXECUTIONS")
          fi
          pnpm test:agents "${ARGS[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rapport-tests-agents
          path: tests/resultats/
          retention-days: 30
