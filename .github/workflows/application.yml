# Vérifications de l'application à chaque envoi et demande de fusion. Aucun secret utilisé.
name: Application

on:
  push:
    paths: ["application/**", ".github/workflows/application.yml"]
  pull_request:
    paths: ["application/**", ".github/workflows/application.yml"]

permissions:
  contents: read

jobs:
  verifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: application/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Mêmes contrôles qu'en local, par la même commande (ADR 0095, 0097). Outils : PostgreSQL (déjà sur la
      # machine), age (sauvegardes chiffrées, décision D12) et Chromium (Playwright).
      - name: Outils du contrôle (age, Chromium)
        run: |
          sudo apt-get install -y age
          pnpm exec playwright install --with-deps chromium
      - name: Contrôle complet
        run: pnpm controler
      - name: Rapport du contrôle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controle
          path: application/.controles/
          include-hidden-files: true
          retention-days: 14
