# Vérifications de l'application à chaque envoi et demande de fusion. Aucun secret utilisé.
name: Application

on:
  push:
    paths: ["application/**", ".github/workflows/application.yml"]
  pull_request:
    paths: ["application/**", ".github/workflows/application.yml"]

permissions:
  contents: read

jobs:
  verifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # revue du Jalon 24, S16 : pas de jeton laissé sur le disque
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: application/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Mêmes contrôles qu'en local, par la même commande (ADR 0095, 0097). Outils : PostgreSQL (déjà sur la
      # machine), age (sauvegardes chiffrées, décision D12) et Chromium (Playwright).
      - name: Outils du contrôle (age, Chromium)
        run: |
          sudo apt-get install -y age
          pnpm exec playwright install --with-deps chromium
      - name: Contrôle complet
        run: pnpm controler
      - name: Rapport du contrôle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controle
          path: application/.controles/
          include-hidden-files: true
          retention-days: 14
