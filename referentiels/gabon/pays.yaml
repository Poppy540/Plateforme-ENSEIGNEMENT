# Fiche pays — Gabon (pays pilote)
code: ga
nom: Gabon
langue_enseignement: fr
langues_vivantes: [en, es]
indicatifs_telephone: ["+241"]   # indicatif téléphonique (connexion par SMS, contact du parent) ; UIT
fuseau_horaire: Africa/Libreville
monnaie: XAF            # franc CFA (CEMAC)
statut_pack: en_preparation   # en_preparation | pilote | ouvert
referentiel:
  code: ga-general
  version: "0.1-provisoire"
  date_validation: null
  source_officielle: "Ministère de l'Éducation Nationale / IPN (Institut Pédagogique National) — documents à obtenir"
paiement:
  moyens: [mobile_money]        # opérateurs à confirmer
  operateurs_otp: a_confirmer
connectivite: "souvent faible, usage surtout sur smartphone"
cadre_legal:
  statut: a_verifier_par_juriste_local
  age_majorite: null   # à confirmer par un juriste local ; inconnu = tout élève traité comme mineur
  # Durées de conservation en jours (null = pas de purge). PROVISOIRES, proposées par Claude Code,
  # à faire valider par un juriste local avant d'ouvrir à de vrais élèves.
  conservation:
    echanges_jours: 365                  # échanges avec le professeur IA
    inscription_non_confirmee_jours: 30  # inscription jamais acceptée par un parent : compte effacé
    compte_inactif_jours: 730            # compte sans activité : effacé
    # Purge étendue (revue de sécurité D3) : null = rien n'est effacé tant que le juriste n'a pas fixé la durée.
    signalements_traites_jours: null     # signalements traités (résumé rédigé par un agent)
    tickets_resolus_jours: null          # tickets du Support résolus
    recrutement_clos_jours: null         # candidats refusés ou supprimés : fiche, messages, dossiers (l'opposition reste)
    rapports_parents_jours: null         # rapports hebdomadaires aux parents
    # Résumés des signalements et tickets à la suppression d'un compte (D2) : garder | effacer ; null = garder.
    resumes_apres_suppression: null
  points: [protection_des_donnees, consentement_des_mineurs, prospection, activite_annexe_des_enseignants_publics, propriete_intellectuelle]
# Suivi du pilote : seuils des critères de suspension (docs/pilote/criteres-arret.md ; ADR 0080). PROPOSITIONS de
# Claude Code, à valider par le propriétaire. null = critère non surveillé (et affiché comme tel).
pilote:
  detresse_delai_heures: 2            # détresse non prise en charge au-delà : « à examiner » (délai des jours scolaires)
  detresse_delai_max_heures: 12       # au-delà : critère « atteint », suspension immédiate à décider (délai maximal)
  erreur_contenu_delai_jours: 7       # erreur de contenu signalée et non traitée au-delà : « à examiner »
  contestations_max_par_question: 2   # plus de contestations que cela sur une même question, en 7 jours : « à examiner »
  depassement_budget_pourcent: 50     # coût des 7 derniers jours au-delà du budget plus ce pourcentage : « à examiner »
  budget_hebdomadaire_usd: null       # budget des agents par semaine, décidé par le propriétaire (condition 11)
calendrier_scolaire: a_definir
equipe_locale:
  referents: []          # aucun recruté à ce jour
  contact_institutionnel: null
