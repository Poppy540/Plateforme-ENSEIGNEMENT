# Graphe de prérequis proposé — famille Mathématiques, collège et lycée (séries C et D) (Gabon).
# PROPOSITION de Claude Code (2026-10-15) à partir des programmes provisoires du pack : chaque lien est
# « à valider » par un enseignant-référent de la famille (espace référent) ; seul un lien validé sert au Tuteur,
# au Scénariste et à l'Évaluateur. Nature : strict (indispensable) ou souple (utile). Format : <unité>/<chapitre>.
# Un prérequis appartient toujours à la même classe ou à une classe inférieure ; le graphe n'a pas de cycle.
